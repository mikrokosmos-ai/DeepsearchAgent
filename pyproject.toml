[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "DeepAgents learning examples for deep research agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "deepagents==0.5.7",
    "fastapi>=0.100.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "markdown>=3.5",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    # D7：锁定 3.x，不再兼容 2.x 的隐式行为差异
    "pandas>=3.0.0,<4.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
    # ===== RAG 基础设施客户端 =====
    "loguru>=0.7.0",
    "pymilvus>=3.0.1",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.6.0",
    "neo4j>=5.20.0",
    "minio>=7.2.0",
    # BGE-M3 混合向量与 Cross-Encoder 重排（D2：CUDA 版 torch）
    "FlagEmbedding>=1.3.0",
    # D2：torch 必须声明为**直接依赖**才能让下方 [tool.uv.sources] 的 CUDA 源生效。
    # 作为 FlagEmbedding 的传递依赖时，uv 会走默认 index（本机为清华镜像），
    # 而该镜像的 torch 在 Windows 上不含 CUDA 构建，会静默退化为 CPU 推理。
    "torch>=2.14.0",
    "torchvision",
    # MinerU 云端 PDF 解析
    "mineru-open-sdk>=0.2.0",
    # D6：百炼 MCP 联网检索
    "openai-agents>=0.4.2",
]

[tool.uv]
package = false

# D2：目标机器有可用 NVIDIA GPU，torch 固定从 PyTorch 官方 CUDA 源安装，
# 避免 PyPI 默认解析到 CPU-only 版本导致 BGE-M3/重排模型退化为 CPU 推理。
# 选 cu130：与本机驱动 CUDA UMD 13.3 匹配（向下兼容），且官方提供 win_amd64 + cp312 轮子。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
